---
deployment:
  tasks:
    - echo "Iniciando despliegue de Strapi CMS..."

    - |
      # ── Configurar rutas ──────────────────────────────────────────────────────
      BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
      echo "Rama detectada: [$BRANCH]"

      # El repositorio se clona directamente en el directorio del dominio.
      # REPO_PATH es el directorio de trabajo actual (public_html/strapi-admin-docs).
      REPO_PATH="$PWD"

      # ┌─────────────────────────────────────────────────────────────────────────
      # │  NODE_ACTIVATE  → ruta al entorno creado por cPanel → Setup Node.js App.
      # │                    Formato: /home/USUARIO/nodevenv/RUTA_APP/VERSION/bin/activate
      # │                    Sustituye USUARIO, RUTA_APP y VERSION con tus valores.
      # └─────────────────────────────────────────────────────────────────────────
      NODE_ACTIVATE="/home/cero208mx/nodevenv/public_html/strapi-admin-docs/22/bin/activate"
      echo "REPO_PATH = [$REPO_PATH]"

    - |
      # ── Activar entorno Node.js (CloudLinux nodevenv) ─────────────────────────
      if [ -f "$NODE_ACTIVATE" ]; then
        . "$NODE_ACTIVATE"
        echo "Node.js activo: $(node --version)"
        echo "npm:           $(npm --version)"
      else
        echo "ERROR: Entorno Node.js no encontrado: [$NODE_ACTIVATE]"
        echo "Crea la aplicación en cPanel → Setup Node.js App apuntando a: $REPO_PATH"
        exit 1
      fi

    - |
      # ── Instalar dependencias de producción ───────────────────────────────────
      . "$NODE_ACTIVATE"
      cd "$REPO_PATH"
      echo "Instalando dependencias (--omit=dev)..."
      npm install --omit=dev
      echo "Dependencias instaladas."

    - |
      # ── Eliminar dist/ anterior y compilar ────────────────────────────────────
      . "$NODE_ACTIVATE"
      cd "$REPO_PATH"

      if [ -d "$REPO_PATH/dist" ]; then
        echo "Eliminando dist/ anterior..."
        rm -rf "$REPO_PATH/dist"
      fi

      echo "Ejecutando npm run build (strapi build)..."
      npm run build

      if [ ! -d "$REPO_PATH/dist/config" ]; then
        echo "ERROR: dist/config/ no existe — el build falló o fue interrumpido."
        exit 1
      fi
      echo "Build completado. Archivos en dist/config/:"
      ls "$REPO_PATH/dist/config/"

    - touch "$REPO_PATH"/tmp/restart.txt
    - echo "Despliegue completado exitosamente."
